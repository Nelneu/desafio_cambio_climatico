name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR metadata and linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) throw new Error('Pull request payload is required');

            const branch = pr.head?.ref || '';
            if (!/^[a-z][a-z0-9-]*\/[a-z0-9][a-z0-9._-]*$/.test(branch)) {
              throw new Error('Branch must be a lowercase namespace/name');
            }

            const types = (pr.labels || []).filter(label =>
              typeof label.name === 'string' && label.name.startsWith('type:'));
            if (types.length !== 1 || types[0].name.length <= 'type:'.length) {
              throw new Error('PR must have exactly one nonempty type:* label');
            }

            const references = [...(pr.body || '').matchAll(/\b(?:Closes|Fixes|Resolves)\s+#([1-9]\d*)\b/gi)];
            const numbers = [...new Set(references.map(match => Number(match[1])))];
            if (numbers.length !== 1 || !Number.isSafeInteger(numbers[0])) {
              throw new Error('PR body must resolve exactly one issue via Closes/Fixes/Resolves #N');
            }

            const {data: issue} = await github.rest.issues.get({
              ...context.repo,
              issue_number: numbers[0],
            });
            if (issue.pull_request || issue.state !== 'open') {
              throw new Error('Linked issue must be an open issue, not a PR');
            }
            if (!issue.labels?.some(label => label.name === 'status:approved')) {
              throw new Error('Linked issue must have status:approved');
            }

  tests:
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install 'numpy>=1.24' 'pandas>=2.0' 'scikit-learn>=1.3'
      - name: Run tests (reject empty discovery)
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No tests discovered')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
